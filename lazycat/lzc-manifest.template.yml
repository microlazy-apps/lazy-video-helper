application:
  subdomain: video-helper
  upstreams:
    - location: /
      backend: http://main:3000
  public_path:
    - /
  health_check:
    test_url: http://main:3000/api/v1/health
    timeout: 10s
    # Cold start budget: Python venv import (faster-whisper / langchain /
    # torch) + init_db + worker_loop start measured at ~110-170s in
    # production. Keep generous headroom so first install isn't flagged
    # as error_state before the FastAPI core finishes booting.
    start_period: 300s

services:
  main:
    image: ${LAZYCAT_IMAGE}
    environment:
      - TZ=Asia/Shanghai

      # FastAPI / data
      - DATA_DIR=/app/data
      - CORE_HOST=127.0.0.1
      - CORE_PORT=8000

      # Next.js standalone — rewrites /api/v1/* to local FastAPI
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - API_BASE_URL=http://127.0.0.1:8000
      - NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1

      # LLM (deploy-params; user can override in Web UI Settings)
      - LLM_API_KEY={{.U.LLM_API_KEY}}
      - LLM_BASE_URL={{.U.LLM_BASE_URL}}
      - LLM_MODEL={{.U.LLM_MODEL}}

      # Whisper (faster-whisper)
      - WHISPER_MODEL={{.U.WHISPER_MODEL}}
    binds:
      - /lzcapp/var/data:/app/data
    healthcheck:
      # Hit FastAPI directly on :8000 — bypass the Next.js proxy at :3000
      # that would return 502/500 while core is still importing heavy
      # Python deps. Container is "healthy" only when the actual API is
      # serving 200; lazycat platform health (application.health_check
      # above) still goes through :3000 as users do.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
